<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Talyson Marques — Automação de processos com Python e IA generativa">
  <title>Talyson Marques — Automação de processos com Python e IA generativa</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA"/><stop offset="1" stop-color="#0F8A5F"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0B2545" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.15"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="320" rx="16"/></clipPath>
    <style>
      .p { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8 } 70%,100% { transform: scale(3.2); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .p { animation: none; opacity: 0 } }
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#m)"/>
    <g stroke="#0969DA" stroke-opacity="0.35" stroke-width="1.2"><line x1="860" y1="70" x2="960" y2="120"/><line x1="960" y1="120" x2="1080" y2="80"/><line x1="1080" y1="80" x2="1140" y2="170"/><line x1="960" y1="120" x2="1010" y2="210"/><line x1="1010" y1="210" x2="1140" y2="170"/><line x1="860" y1="70" x2="820" y2="150"/><line x1="820" y1="150" x2="900" y2="190"/><line x1="900" y1="190" x2="960" y2="120"/><line x1="900" y1="190" x2="1010" y2="210"/><line x1="1010" y1="210" x2="1080" y2="260"/><line x1="1080" y1="260" x2="1140" y2="170"/><line x1="900" y1="190" x2="950" y2="280"/><line x1="950" y1="280" x2="1010" y2="210"/><line x1="1080" y1="80" x2="1160" y2="60"/><line x1="1160" y1="60" x2="1140" y2="170"/></g>
    <circle cx="860" cy="70" r="5" fill="none" stroke="#0F8A5F" class="p" style="animation-delay:0.00s"/><circle cx="860" cy="70" r="5" fill="#0F8A5F"/>
    <circle cx="960" cy="120" r="3.5" fill="#0969DA"/>
    <circle cx="1080" cy="80" r="3.5" fill="#0969DA"/>
    <circle cx="1140" cy="170" r="5" fill="none" stroke="#0F8A5F" class="p" style="animation-delay:1.35s"/><circle cx="1140" cy="170" r="5" fill="#0F8A5F"/>
    <circle cx="1010" cy="210" r="3.5" fill="#0969DA"/>
    <circle cx="900" cy="190" r="3.5" fill="#0969DA"/>
    <circle cx="820" cy="150" r="5" fill="none" stroke="#0F8A5F" class="p" style="animation-delay:2.70s"/><circle cx="820" cy="150" r="5" fill="#0F8A5F"/>
    <circle cx="1080" cy="260" r="3.5" fill="#0969DA"/>
    <circle cx="950" cy="280" r="3.5" fill="#0969DA"/>
    <circle cx="1160" cy="60" r="5" fill="none" stroke="#0F8A5F" class="p" style="animation-delay:4.05s"/><circle cx="1160" cy="60" r="5" fill="#0F8A5F"/>
    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#D0D7DE"/>

  <text x="72" y="96" fill="#0F8A5F" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="2.5">AUTOMAÇÃO · PYTHON · IA GENERATIVA</text>
  <text x="70" y="168" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5">Talyson Marques</text>
  <rect x="72" y="192" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="236" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Automação de processos com Python e IA generativa</text>
  <text x="72" y="270" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">Analista na Accenture Brasil  ·  Praia Grande, SP</text>
</svg>
